modLoader = "javafml"
loaderVersion = "[4,)"
license = "${mod_license}"

[[mods]]
modId = "advancementoverhaul"
version = "${mod_version}"
displayName = "${mod_name}"
description = "${mod_description}"
logoFile = "icon.png"

[[mixins]]
config = "advancementoverhaul.mixins.json"

# 依赖 key 使用固定名称，避免 TOML 解析器报错
# processResources 的 expand() 仍会正确展开其他 ${} 占位符
[[dependencies.advancementoverhaul]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.advancementoverhaul]]
modId = "minecraft"
type = "required"
versionRange = "${mc_version_range}"
ordering = "NONE"
side = "BOTH"

# Optional integration dependencies (not required to run the mod).
[[dependencies.advancementoverhaul]]
modId = "kubejs"
type = "optional"
versionRange = "[2101.7,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.advancementoverhaul]]
modId = "ftbquests"
type = "optional"
versionRange = "[2101.1,)"
ordering = "AFTER"
side = "BOTH"